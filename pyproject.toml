[project]
name = "eliis-homeassistant"
version = "0.1.0"
description = "Unofficial read-only Home Assistant integration for Eliis kindergartens"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = []

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["custom_components", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = [".git", ".venv"]
