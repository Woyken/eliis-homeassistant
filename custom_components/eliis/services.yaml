get_menu:
  name: Get menu
  description: Return sanitized weekly-menu days for an Eliis institution device.
  fields:
    device_id:
      name: Institution device
      description: The Eliis institution device to query.
      required: true
      selector:
        device:
          integration: eliis
    start_date:
      name: Start date
      description: First source date to return. Defaults to today.
      selector:
        date:
    end_date:
      name: End date
      description: Last source date to return. Defaults to the start date.
      selector:
        date:

get_feed_summary:
  name: Get feed summary
  description: Return bounded guardian-feed date and count summaries for a child device.
  fields:
    device_id:
      name: Child device
      description: The Eliis child device to query.
      required: true
      selector:
        device:
          integration: eliis
    pages:
      name: Pages
      description: Number of bounded feed pages to walk (1-3).
      default: 1
      selector:
        number:
          min: 1
          max: 3
          mode: box

get_status_history:
  name: Get status history
  description: Return status-log records for one explicit date.
  fields:
    device_id:
      name: Child device
      description: The Eliis child device to query.
      required: true
      selector:
        device:
          integration: eliis
    date:
      name: Date
      description: Source date to query.
      required: true
      selector:
        date:

refresh:
  name: Refresh
  description: Request a coalesced refresh for one account or module.
  fields:
    config_entry_id:
      name: Account
      description: The Eliis account to refresh.
      required: true
      selector:
        config_entry:
          integration: eliis
    module:
      name: Module
      description: Optional module to refresh instead of the whole account.
      selector:
        select:
          options:
            - menu
            - feed
            - status
            - notifications
            - events
